# Releases @michinarai/sdk (README › Releasing). npm's trusted publishing only: no token anywhere, in CI or out.
# - A version tag (v1.2.3, equal to package.json's version) packs the tarball, PUBLISHES it on npm (`npm publish`, over
#   OIDC, with provenance), and makes a GitHub release with the tarball and SHA256SUMS. A tag publishes; nothing to
#   approve.
# - By hand (workflow_dispatch): a dry run. The same gates and the same tarball, kept with SHA256SUMS as an artifact:
#   the one-time first publish of a package (which trusted publishing can't do) is that tarball, from a maintainer's machine.
# Only the npm tarball ships: no raw binaries.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Chromium, for the harness e2e
        run: npx playwright install --with-deps chromium
      - name: The gates
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: The version is the tag's, the name is the scope's
        id: version
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          version=$(node -p 'require("./package.json").version')
          name=$(node -p 'require("./package.json").name')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"; exit 1
          fi
          case "$name" in "$NPM_SCOPE"/*) ;; *) echo "::error::$name isn't under the repository variable NPM_SCOPE ($NPM_SCOPE)"; exit 1;; esac
      - name: Pack, and the checksums
        id: pack
        run: |
          mkdir -p release
          tarball=$(npm pack --pack-destination release --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename)')
          (cd release && sha256sum "$tarball" > SHA256SUMS && cat SHA256SUMS)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest # trusted publishing takes GitHub-hosted runners only
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusts, instead of any npm token
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: npm 11.21 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11.21.0 && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the tarball against its checksum
        run: cd release && sha256sum -c SHA256SUMS
      - name: Publish it on npm
        run: npm publish "release/${{ needs.pack.outputs.tarball }}" --access public

  github-release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: The GitHub release, with the tarball and SHA256SUMS
        run: gh release create "$GITHUB_REF_NAME" "release/${{ needs.pack.outputs.tarball }}" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "@michinarai/sdk $GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
